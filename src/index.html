<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./output.css">

<body>
    
    <section class="relative min-h-screen bg-[#000000] text-white flex items-center overflow-hidden font-sans px-4 sm:px-8 md:px-16 lg:px-24 py-20">
  
  <div class="absolute inset-0 bg-[radial-gradient(#1a1a1a_1px,transparent_1px)] [background-size:24px_24px] opacity-60 pointer-events-none"></div>

  <div class="relative z-10 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
    
    <div class="flex flex-col items-center text-center lg:items-start lg:text-left space-y-6">
      
      <h1 class="text-4xl sm:text-5xl md:text-6xl font-black tracking-tight leading-[1.1] max-w-xl">
        Transforming Data <br class="hidden sm:inline" />
        into <span class="inline-block bg-[#007bfe] text-white px-4 py-1 sm:px-5 rounded-[14px] mt-2 lg:mt-0">Decisions</span>
      </h1>

      <p class="text-gray-400 text-base sm:text-lg md:text-xl font-normal max-w-md leading-relaxed">
        Leverage the power of machine learning and AI to unlock insights and drive business growth
      </p>

      <button class="bg-[#007bfe] hover:bg-[#0069d9] transition-all duration-200 text-white font-medium text-sm sm:text-base px-6 py-3 rounded-[10px] shadow-lg shadow-blue-500/10">
        Book a Meeting
      </button>

      <div class="flex items-center space-x-3 pt-4">
        <div class="flex -space-x-2">
          <img class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border-2 border-black object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Client 1">
          <img class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border-2 border-black object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" alt="Client 2">
          <img class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border-2 border-black object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Client 3">
        </div>
        <p class="text-gray-400 text-xs sm:text-sm font-normal">
          Over <span class="text-white font-semibold">100+</span> clients have worked with us
        </p>
      </div>

    </div>

    <div class="flex justify-center items-center w-full lg:justify-end">
      <img src="..//3ba4c9ccacca7e770b226edc66b9b9aaf979c467 (3).png" alt="Catalyst Analytics Robot" class="w-full max-w-[320px] sm:max-w-[400px] md:max-w-[450px] lg:max-w-[500px] h-auto object-contain drop-shadow-[0_10px_30px_rgba(0,123,254,0.15)] animate-pulse-slow" />
    </div>

  </div>
